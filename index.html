<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>800+ 線上配鏡測試</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f8fb;color:#17324d}header{padding:18px;background:white;border-bottom:1px solid #dde5ec;position:sticky;top:0}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dde5ec;border-radius:18px;padding:16px;margin-bottom:14px}h1{font-size:22px;margin:0}.step{font-weight:800;color:#0b6fb8;font-size:13px}.stage{position:relative;background:#e9eef3;border-radius:14px;min-height:300px;overflow:hidden;display:flex;align-items:center;justify-content:center}.stage img.face{max-width:100%;max-height:70vh}.glasses{position:absolute;display:none;left:50%;top:43%;width:56%;transform:translate(-50%,-50%);pointer-events:none}.g1,.g2{position:absolute;border:8px solid #202020;width:34%;height:17%;top:37%;border-radius:28px;display:none}.g1{left:14%}.g2{right:14%}.bridge{position:absolute;left:47%;top:45%;width:6%;border-top:8px solid #202020;display:none}button{width:100%;padding:14px;border:0;border-radius:13px;background:#0b6fb8;color:white;font-weight:800;font-size:17px;margin-top:8px}.secondary{background:#edf5fb;color:#0b6fb8;border:1px solid #c7dcec}input{width:100%;padding:12px;border:1px solid #cbd7e2;border-radius:12px;font-size:16px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{font-size:13px;line-height:1.55;color:#627386}.result{white-space:pre-wrap;background:#f4f9fd;padding:12px;border-radius:12px;margin-top:10px}</style></head><body><header><h1>800+ 線上配鏡</h1><div class="note">第一階段手機測試版｜不連正式資料庫</div></header><main><div class="card"><div class="step">STEP 1</div><h2>會員</h2><input id="member" placeholder="member_id（測試可填 1）"></div><div class="card"><div class="step">STEP 2</div><h2>拍正面照片</h2><input id="photo" type="file" accept="image/*" capture="user"><div class="note">請正面、光線均勻、雙眼清楚。</div></div><div class="card"><div class="step">STEP 3</div><h2>靜態試戴</h2><div class="grid"><button class="secondary" id="frame1">方框</button><button class="secondary" id="hide">隱藏</button></div><div class="stage"><span id="empty">先拍一張正面照片</span><img id="face" class="face"><div id="l" class="g1"></div><div id="r" class="g2"></div><div id="b" class="bridge"></div></div></div><div class="card"><div class="step">STEP 4</div><h2>PD 初步資料</h2><input id="pd" type="number" min="40" max="80" step="0.1" placeholder="例：63.5"><div class="note">正式值由客服以卡片四角＋雙眼瞳孔六點人工校正。</div></div><div class="card"><div class="step">STEP 5</div><h2>上傳驗光單</h2><input id="rx" type="file" accept="image/*,application/pdf" capture="environment"><div class="note">正式流程由客服人工核對 SPH／CYL／AXIS。</div></div><div class="card"><button id="submit">送出給客服覆核</button><div id="out" class="result" style="display:none"></div></div></main><script>const photo=document.getElementById('photo'),face=document.getElementById('face');photo.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=x=>{face.src=x.target.result;document.getElementById('empty').style.display='none'};rd.readAsDataURL(f)};document.getElementById('frame1').onclick=()=>['l','r','b'].forEach(id=>document.getElementById(id).style.display='block');document.getElementById('hide').onclick=()=>['l','r','b'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('submit').onclick=()=>{const m=document.getElementById('member').value.trim();if(!m){alert('請填 member_id');return}if(!photo.files[0]){alert('請先拍正面照片');return}const o=document.getElementById('out');o.style.display='block';o.textContent='測試送件成功\nstatus: pending\n等待人工 PD 與驗光資料覆核\n\n本測試不會寫入正式資料庫。'}</script></body></html>
